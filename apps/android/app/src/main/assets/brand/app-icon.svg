<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title description">
<title id="title">Lone Smart Room — ícone do aplicativo</title>
<desc id="description">Lone Smart Room. Recriação vetorial baseada na referência aprovada; contorno angular vermelho neon e lettering geométrico.</desc>
<defs>
  <filter id="neon" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
    <feGaussianBlur stdDeviation="1.35"/><feComponentTransfer><feFuncA type="linear" slope="0.6"/></feComponentTransfer>
  </filter>
  <linearGradient id="iconBase" x2="0.9" y2="1"><stop stop-color="#170b11"/><stop offset="0.6" stop-color="#09090d"/><stop offset="1" stop-color="#050609"/></linearGradient>
  <linearGradient id="iconEdge" x2="1" y2="1"><stop stop-color="#ff0033"/><stop offset="0.5" stop-color="#b20b2c"/><stop offset="1" stop-color="#ff1744"/></linearGradient>
</defs>
<rect x="2" y="2" width="252" height="252" rx="57" fill="url(#iconBase)" stroke="url(#iconEdge)" stroke-width="2.5"/>
<g transform="translate(38 30) scale(1.7)" fill="none" stroke="#ff0033" stroke-width="2.2" stroke-linejoin="miter" stroke-miterlimit="5"><g filter="url(#neon)"><path d="M14 8 L14 84 L26 96 L92 96 L78 82 L43 82 L31 70 L31 25 Z"/><path d="M42 39 L42 64 L53 75 L70 75 Z"/></g><path d="M14 8 L14 84 L26 96 L92 96 L78 82 L43 82 L31 70 L31 25 Z"/><path d="M42 39 L42 64 L53 75 L70 75 Z"/></g>
