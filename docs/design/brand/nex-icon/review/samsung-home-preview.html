<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; script-src 'none'; object-src 'none'">
  <title>NEX · simulação visual de tela inicial</title>
  <link rel="stylesheet" href="samsung-home-preview.css">
</head>
<body>
  <header class="notice">SIMULAÇÃO VISUAL · NÃO É CAPTURA DO SAMSUNG</header>
  <main class="phone" aria-label="Simulação de tela inicial inspirada na organização Samsung One UI">
    <div class="status"><span>9:41</span><span class="camera"></span><span>▴ ▰ 84%</span></div>
    <section class="clock"><strong>09:41</strong><span>LONE SMART ROOM</span><small>Prévia do ícone oficial NEX</small></section>
    <div class="search">⌕ <span>Pesquisar</span> ⋮</div>
    <section class="grid" aria-label="Grade ilustrativa de aplicativos">
      <div class="app"><img src="../rounded-512.png" width="56" height="56" alt="Ícone oficial NEX"><span>Lone Smart<br>Room</span></div>
      <div class="app"><div class="placeholder neutral">▦</div><span>Galeria</span></div>
      <div class="app"><div class="placeholder neutral">◷</div><span>Relógio</span></div>
      <div class="app"><div class="placeholder neutral">⚙</div><span>Configurações</span></div>
    </section>
    <div class="pages">● <span>○</span></div>
    <div class="dock"><div class="placeholder">⌕</div><div class="placeholder">☏</div><div class="placeholder">▢</div><div class="placeholder">◎</div></div>
    <footer><i></i></footer>
  </main>
</body>
</html>
